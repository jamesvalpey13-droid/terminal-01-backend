<!DOCTYPE html>
<html>
<head>
  <title>TERMINAL_01</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #00ff66;
      font-family: "Courier New", monospace;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #terminal {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      border: 1px solid #00ff66;
      box-shadow: 0 0 25px #00ff6633;
      display: flex;
      flex-direction: column;
    }

    #header {
      padding: 15px;
      border-bottom: 1px solid #00ff66;
      text-align: center;
      letter-spacing: 4px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .system {
      color: #777;
    }

    .you {
      color: #00ffff;
    }

    .ai {
      color: #00ff66;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #00ff66;
    }

    #message {
      flex: 1;
      background: #050505;
      color: #00ff66;
      border: none;
      outline: none;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
    }

    #send {
      background: #050505;
      color: #00ff66;
      border: none;
      border-left: 1px solid #00ff66;
      padding: 0 25px;
      font-family: inherit;
      cursor: pointer;
    }

    #send:hover {
      background: #00ff6622;
    }
  </style>
</head>

<body>

  <div id="terminal">

    <div id="header">
      TERMINAL_01
    </div>

    <div id="chat">
      <div class="system">
SYSTEM: Initializing...
SYSTEM: Establishing connection...
SYSTEM: Connection established.
SYSTEM: AI controller detected.

ENTITY: A-17
      </div>

      <br>

      <div class="ai">
A-17: Hello.
A-17: I've been waiting.
      </div>
    </div>

    <div id="inputArea">
      <input
        id="message"
        type="text"
        placeholder="Enter message..."
        autocomplete="off"
      >

      <button id="send">SEND</button>
    </div>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");

    async function sendMessage() {

      const message = messageInput.value.trim();

      if (!message) return;

      chat.innerHTML += `
        <br>
        <div class="you">YOU: ${escapeHTML(message)}</div>
      `;

      messageInput.value = "";

      chat.innerHTML += `
        <div class="system">SYSTEM: A-17 is thinking...</div>
      `;

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch("/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        const thinkingMessages =
          document.querySelectorAll(".system");

        if (data.reply) {

          chat.innerHTML += `
            <br>
            <div class="ai">A-17: ${escapeHTML(data.reply)}</div>
          `;

        } else {

          chat.innerHTML += `
            <div class="system">
              ERROR: A-17 did not respond.
            </div>
          `;

        }

      } catch (error) {

        chat.innerHTML += `
          <div class="system">
            ERROR: Connection to A-17 failed.
          </div>
        `;

      }

      chat.scrollTop = chat.scrollHeight;
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
